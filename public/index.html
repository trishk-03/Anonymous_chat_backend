<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Chat Backend Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 2rem;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e2e8f0;
    }

    .status-dot.connected {
      background: var(--accent-emerald);
      box-shadow: 0 0 10px var(--accent-emerald);
    }

    .status-dot.disconnected {
      background: var(--accent-rose);
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    @media (max-width: 1024px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 8px;
      outline: none;
    }

    input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem 0.8rem;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent-purple);
    }

    button {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: white;
      border: none;
      padding: 0.65rem 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    button.danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .room-info-card {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .info-value {
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      color: #c084fc;
    }

    .members-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 180px;
      overflow-y: auto;
    }

    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.5);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .badge-admin {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .chat-box {
      display: flex;
      flex-direction: column;
      height: 250px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.4);
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      padding: 0.75rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chat-msg {
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .chat-sender {
      font-weight: 600;
      color: #60a5fa;
    }

    .chat-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 0.5rem;
    }

    .chat-input-area {
      display: flex;
      padding: 0.5rem;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.8);
      border-top: 1px solid var(--border-color);
    }

    .chat-input-area input {
      flex: 1;
    }

    .event-log {
      font-family: 'Fira Code', monospace;
      font-size: 0.82rem;
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem;
      flex: 1;
      overflow-y: auto;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .log-item {
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-item.sent {
      background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid var(--accent-blue);
      color: #93c5fd;
    }

    .log-item.received {
      background: rgba(16, 185, 129, 0.1);
      border-left: 3px solid var(--accent-emerald);
      color: #6ee7b7;
    }

    .log-item.error {
      background: rgba(244, 63, 94, 0.1);
      border-left: 3px solid var(--accent-rose);
      color: #fda4af;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">A</div>
      <h1>Anonymous Chat Backend Inspector</h1>
    </div>
    <div class="status-badge">
      <div id="statusDot" class="status-dot disconnected"></div>
      <span id="statusText">Disconnected</span>
    </div>
  </header>

  <div class="main-container">
    <!-- Left Column: Operations -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
      
      <!-- Room Actions -->
      <div class="card grid-2">
        <!-- Create Room -->
        <div class="form-group">
          <div class="card-title" style="margin-bottom: 0.5rem;">Create Room</div>
          <label>Room Name</label>
          <input type="text" id="createRoomName" placeholder="e.g. Secret Lounge">
          <label style="margin-top: 0.4rem;">Your Username</label>
          <input type="text" id="createUsername" placeholder="e.g. Alice">
          <button style="margin-top: 0.6rem;" onclick="createRoom()">Create Room</button>
        </div>

        <!-- Join Room -->
        <div class="form-group">
          <div class="card-title" style="margin-bottom: 0.5rem;">Join Room</div>
          <label>Room ID</label>
          <input type="text" id="joinRoomId" placeholder="e.g. X7K9P2">
          <label style="margin-top: 0.4rem;">Password</label>
          <input type="text" id="joinPassword" placeholder="e.g. a1b2c3d4">
          <label style="margin-top: 0.4rem;">Your Username</label>
          <input type="text" id="joinUsername" placeholder="e.g. Bob">
          <button class="secondary" style="margin-top: 0.6rem;" onclick="joinRoom()">Join Room</button>
        </div>
      </div>

      <!-- Active Room Details & Members -->
      <div class="card" id="activeRoomCard" style="display: none;">
        <div class="card-title">
          <span>Active Room: <span id="displayRoomName" style="color: white;">-</span></span>
          <button class="secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="leaveRoom()">Leave Room</button>
        </div>

        <div class="room-info-card">
          <div class="info-row">
            <span>Room ID:</span>
            <span class="info-value" id="displayRoomId">-</span>
          </div>
          <div class="info-row">
            <span>Password:</span>
            <span class="info-value" id="displayPassword">-</span>
          </div>
          <div class="info-row">
            <span>Your User ID:</span>
            <span class="info-value" id="displayUserId">-</span>
          </div>
          <div class="info-row">
            <span>Expires At:</span>
            <span class="info-value" id="displayExpiresAt">-</span>
          </div>
        </div>

        <!-- Members & Admin Controls -->
        <div>
          <div class="card-title" style="margin-bottom: 0.5rem;">Members (<span id="memberCount">0</span>)</div>
          <div class="members-list" id="membersList"></div>
        </div>

        <div id="adminControls" style="display: none; margin-top: 0.5rem;">
          <button class="danger" style="width: 100%;" onclick="deleteRoom()">Delete Room (Admin Action)</button>
        </div>
      </div>

      <!-- Live Chat Messaging -->
      <div class="card">
        <div class="card-title">Room Chat</div>
        <div class="chat-box">
          <div class="chat-messages" id="chatMessages">
            <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: auto;">Join or create a room to send messages</div>
          </div>
          <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()">Send</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Right Column: Live Event Inspector -->
    <div class="card">
      <div class="card-title">
        <span>Live WebSocket Inspector</span>
        <button class="secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="clearLogs()">Clear Log</button>
      </div>
      <div class="event-log" id="eventLog"></div>
    </div>
  </div>

  <script>
    let ws = null;
    let state = {
      roomId: null,
      roomName: null,
      password: null,
      userId: null,
      username: null,
      isAdmin: false,
      members: []
    };

    function initWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('statusDot').className = 'status-dot connected';
        document.getElementById('statusText').innerText = 'Connected';
        logEvent('SYSTEM', 'Connected to WebSocket server');
      };

      ws.onclose = () => {
        document.getElementById('statusDot').className = 'status-dot disconnected';
        document.getElementById('statusText').innerText = 'Disconnected';
        logEvent('SYSTEM', 'WebSocket connection closed');
        resetState();
      };

      ws.onerror = (err) => {
        logEvent('ERROR', 'WebSocket error encountered');
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleIncomingMessage(msg);
        } catch (e) {
          logEvent('ERROR', 'Failed to parse JSON: ' + event.data);
        }
      };
    }

    function sendJSON(type, payload = {}) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert('WebSocket is not connected.');
        return;
      }
      const msg = { type, payload };
      ws.send(JSON.stringify(msg));
      if (type !== 'pong') {
        logEvent('SENT', msg);
      }
    }

    function handleIncomingMessage(msg) {
      const { type, payload } = msg;

      // Handle heartbeat silently log
      if (type === 'ping') {
        sendJSON('pong', {});
        return;
      }

      logEvent(type === 'error' ? 'ERROR' : 'RECEIVED', msg);

      switch (type) {
        case 'room_created':
          state.roomId = payload.roomId;
          state.roomName = payload.roomName;
          state.password = payload.password;
          state.userId = payload.userId;
          state.isAdmin = true;
          state.members = [{ userId: payload.userId, username: document.getElementById('createUsername').value, isAdmin: true }];
          updateUI();
          break;

        case 'join_success':
          state.roomId = payload.roomId;
          state.roomName = payload.roomName;
          state.userId = payload.userId;
          state.members = payload.members || [];
          const currentUser = state.members.find(m => m.userId === state.userId);
          state.isAdmin = currentUser ? currentUser.isAdmin : false;
          updateUI();
          break;

        case 'user_joined':
          if (!state.members.some(m => m.userId === payload.userId)) {
            state.members.push({ userId: payload.userId, username: payload.username, isAdmin: false });
          }
          updateUI();
          appendChatMessage('System', `${payload.username} joined the room.`, true);
          break;

        case 'chat_message':
          appendChatMessage(payload.username, payload.text, false, payload.sentAt);
          break;

        case 'user_left':
          state.members = state.members.filter(m => m.userId !== payload.userId);
          updateUI();
          appendChatMessage('System', `${payload.username} left the room.`, true);
          break;

        case 'admin_changed':
          state.members.forEach(m => {
            m.isAdmin = (m.userId === payload.newAdminUserId);
          });
          if (state.userId === payload.newAdminUserId) {
            state.isAdmin = true;
          }
          updateUI();
          appendChatMessage('System', `${payload.newAdminUsername} is now the Admin${payload.reason ? ' (' + payload.reason + ')' : ''}.`, true);
          break;

        case 'room_deleted':
          alert('The room has been deleted by the admin.');
          resetState();
          break;

        case 'room_expired':
          alert('This room has expired.');
          resetState();
          break;

        case 'error':
          alert(`Error [${payload.code}]: ${payload.message}`);
          break;
      }
    }

    function createRoom() {
      const roomName = document.getElementById('createRoomName').value.trim();
      const username = document.getElementById('createUsername').value.trim();
      if (!roomName || !username) {
        alert('Please fill in both Room Name and Username.');
        return;
      }
      state.username = username;
      sendJSON('create_room', { roomName, username });
    }

    function joinRoom() {
      const roomId = document.getElementById('joinRoomId').value.trim();
      const password = document.getElementById('joinPassword').value.trim();
      const username = document.getElementById('joinUsername').value.trim();
      if (!roomId || !password || !username) {
        alert('Please fill in Room ID, Password, and Username.');
        return;
      }
      state.username = username;
      sendJSON('join_room', { roomId, password, username });
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      sendJSON('chat_message', { text });
      appendChatMessage('You', text, false);
      input.value = '';
    }

    function leaveRoom() {
      sendJSON('leave_room', {});
      resetState();
    }

    function deleteRoom() {
      if (confirm('Are you sure you want to delete this room for all members?')) {
        sendJSON('delete_room', {});
      }
    }

    function delegateAdmin(newAdminUserId) {
      sendJSON('delegate_admin', { newAdminUserId });
    }

    function updateUI() {
      const card = document.getElementById('activeRoomCard');
      if (state.roomId) {
        card.style.display = 'flex';
        document.getElementById('displayRoomName').innerText = state.roomName || '-';
        document.getElementById('displayRoomId').innerText = state.roomId;
        document.getElementById('displayPassword').innerText = state.password || '(Hidden/Joined)';
        document.getElementById('displayUserId').innerText = state.userId;
        document.getElementById('displayExpiresAt').innerText = 'In ~3 hours';

        // Update members list
        document.getElementById('memberCount').innerText = state.members.length;
        const listEl = document.getElementById('membersList');
        listEl.innerHTML = '';
        state.members.forEach(m => {
          const div = document.createElement('div');
          div.className = 'member-item';
          
          let actions = '';
          if (state.isAdmin && m.userId !== state.userId) {
            actions = `<button class="secondary" style="padding: 0.2rem 0.4rem; font-size: 0.75rem;" onclick="delegateAdmin('${m.userId}')">Make Admin</button>`;
          }

          div.innerHTML = `
            <div>
              <span>${m.username}</span>
              ${m.userId === state.userId ? ' <span style="color:var(--text-muted); font-size: 0.8rem;">(You)</span>' : ''}
              ${m.isAdmin ? ' <span class="badge-admin">ADMIN</span>' : ''}
            </div>
            ${actions}
          `;
          listEl.appendChild(div);
        });

        // Show/hide admin controls
        document.getElementById('adminControls').style.display = state.isAdmin ? 'block' : 'none';
      } else {
        card.style.display = 'none';
      }
    }

    function resetState() {
      state = {
        roomId: null,
        roomName: null,
        password: null,
        userId: null,
        username: null,
        isAdmin: false,
        members: []
      };
      updateUI();
    }

    function appendChatMessage(sender, text, isSystem = false, timeMs = Date.now()) {
      const chatContainer = document.getElementById('chatMessages');
      const timeStr = new Date(timeMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg';

      if (isSystem) {
        msgDiv.style.color = 'var(--text-muted)';
        msgDiv.style.fontStyle = 'italic';
        msgDiv.innerHTML = `[${timeStr}] ${text}`;
      } else {
        msgDiv.innerHTML = `<span class="chat-sender">${sender}:</span> <span>${escapeHtml(text)}</span> <span class="chat-time">${timeStr}</span>`;
      }

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function logEvent(tag, data) {
      const logContainer = document.getElementById('eventLog');
      const div = document.createElement('div');
      const timestamp = new Date().toLocaleTimeString();
      let className = 'log-item';
      if (tag === 'SENT') className += ' sent';
      else if (tag === 'RECEIVED') className += ' received';
      else if (tag === 'ERROR') className += ' error';

      const content = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
      div.className = className;
      div.innerText = `[${timestamp}] [${tag}]\n${content}`;

      logContainer.appendChild(div);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('eventLog').innerHTML = '';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Connect on page load
    window.addEventListener('DOMContentLoaded', initWebSocket);
  </script>
</body>
</html>
